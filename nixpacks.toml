[providers]
providers = ["python"]

[phases.setup]
nixPkgs = ["ffmpeg", "git", "nodejs"]

[phases.install]
cmds = [
  "pip install --upgrade pip setuptools<70.0.0 wheel",
  "pip install --no-build-isolation -r requirements-railway.txt",
  "cd frontend && npm install && npm run build"
]

[start]
cmd = "sh -c 'if [ \"$RAILWAY_SERVICE_NAME\" = \"worker\" ]; then exec bash scripts/start_workers.sh; else exec uvicorn backend.main:app --host 0.0.0.0 --port $PORT; fi'"
